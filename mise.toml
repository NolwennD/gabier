[tools]
# The hk version is also written in the amends URL of hk.pkl: change both together.
hk = "2.9.0"

[tools."github:openjavaformat/open-java-format"]
version = "2.98.0.6"

# ripwire: a read-only map of a codebase (links by name, not semantics) to orient an agent before it reads code.
# Never run its install.sh: it activates skills for the whole account.
[tools."github:redhat-et/ripwire"]
version = "0.6.9"

[vars]
# jdtls (the Eclipse JDT language server) has no mise registry entry and no GitHub release: Eclipse publishes tarballs.
# scripts/jdtls-install.sh installs this milestone after checking the archive against the sha256 pinned here. To bump
# jdtls, change both values together: the version (another milestone of
# https://download.eclipse.org/jdtls/milestones/; never the unpinned snapshots) and the sha256 of its archive
# (`sha256sum` of the file that `<milestone>/latest.txt` names, compared with the `.sha256` Eclipse publishes next to it).
jdtls_version = "1.63.0"
jdtls_sha256 = "b1f2abe0b3cccb462cf64fb4a5587c7d09df60cf8be7748b152cbd89d018bdc4"

[env]
# Outside the repository: every worktree shares one install.
JDTLS_HOME = "{{ env.HOME }}/.local/share/jdtls/{{ vars.jdtls_version }}"
# The path of the jdtls launcher, read by the probe tests.
GABIER_JDTLS = "{{ env.JDTLS_HOME }}/bin/jdtls"
_.path = ["{{ env.JDTLS_HOME }}/bin"]

[tasks."jdtls:install"]
description = "Install the pinned jdtls (checksum verified) outside the repository, shared by all worktrees"
run = "sh scripts/jdtls-install.sh {{ vars.jdtls_version }} {{ vars.jdtls_sha256 }}"

[tasks.install]
description = "Build the native cli and the daemon and link gabier and gabier-daemon into ~/.local/bin (GABIER_BIN_DIR to change it)"
run = "sh scripts/install.sh"

[hooks]
# Installs the Git pre-commit hook (see hk.pkl) and jdtls as part of `mise install`.
postinstall = ["hk install --mise", { task = "jdtls:install" }]
