# The full bin/ci on every pull request: the same stages as on the machine of a developer (format, build, test, native,
# jdtls), none skipped (`--all`). The required check of the protection of `main` is the job `bin-ci`.
#
# The release (release.yml) calls this workflow on the tagged commit, so a release is built only after the same check
# passed. The environment of the build is the action `setup-build`, shared with the release.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bin-ci:
    name: bin-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bin/ci
        run: mise exec -- bin/ci --all

  # macOS and Windows (0.5.0): what builds and passes there is not known yet, so these jobs are informative: they are not
  # required by the protection of `main` (only `bin-ci` is), they run every stage that can run on the system, one step
  # each and every one even after a failure, so that a single run lists everything that breaks (the resolution of the issue
  # the-ci-runs-the-build-and-tests-on-macos-and-windows holds the list). Without mise, hk and jdtls: the stages `format`,
  # `release-install` and `jdtls` need them and the shell tools of Linux.
  #
  # They do not run when the release calls this workflow (a tag is a `push`): a red informative job must not stop a release.
  bin-ci-other:
    name: bin-ci-${{ matrix.label }}
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: "false"

      - name: Stage build
        id: build
        shell: bash
        run: java --source 25 bin/ci --stage build

      # One test class with the full output, to read why the cli tests fail on macOS (the stage below only counts them).
      - name: Cli tests, one class, full output (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: |
          # Throwaway: the assertion at line 72 shows the stderr of the cli with its exit code.
          python3 - <<'PY'
          p = "modules/cli/src/test/java/eu/gabier/cli/DaemonAnswersTest.java"
          s = open(p).read()
          s = s.replace("assertThat(runWithSocket(withJson.toArray(String[]::new))).isEqualTo(2);",
                        "int code = runWithSocket(withJson.toArray(String[]::new)); assertThat(code).as(\"STDERR[\" + err() + \"] OUT[\" + out() + \"]\").isEqualTo(2);")
          open(p, "w").write(s)
          PY
          ./gradlew :cli:test --tests '*DaemonAnswersTest' --console=plain -i

      - name: Stage test
        id: test
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: java --source 25 bin/ci --stage test

      - name: Stage native
        id: native
        if: ${{ !cancelled() }}
        shell: bash
        run: java --source 25 bin/ci --stage native

      # The stages above launch `./gradlew`, which Windows cannot run as a program (CreateProcess error 193): that is the first
      # thing they show there. To see what else breaks, Gradle is run directly on Windows, from bash.
      - name: Gradle assemble (Windows)
        timeout-minutes: 20
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: ./gradlew assemble --console=plain

      - name: Gradle check (Windows)
        timeout-minutes: 20
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: ./gradlew check --console=plain

      - name: Gradle native cli and daemon (Windows)
        timeout-minutes: 20
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          ./gradlew :cli:nativeCompile :daemon:installDist --console=plain
          modules/cli/build/native/nativeCompile/gabier.exe --version
