# The build environment of gabier on a GitHub runner, written once for the check (ci.yml) and for the release
# (release.yml): the code is already checked out when it runs.
#
# No version is written here: the JDK is the one of `.sdkmanrc`, the GraalVM has the major version of the Java toolchain
# of the build (build-logic), and mise installs the tools and jdtls (with its checksum) of `mise.toml`.
name: Set up the build
description: GraalVM, the JDK of .sdkmanrc, mise, the pinned tools and jdtls

inputs:
  github-token:
    description: The token the GraalVM setup uses to download its release without a rate limit
    required: true

runs:
  using: composite
  steps:
    # The GraalVM of the release the build uses: the Java toolchain of the modules, and the native-image of the cli.
    - name: Read the Java release of the build
      id: java
      shell: bash
      run: |
        release=$(grep -ohE 'JavaLanguageVersion\.of\([0-9]+\)' build-logic/src/main/kotlin/gabier.java-module-conventions.gradle.kts | grep -oE '[0-9]+' | head -n 1)
        test -n "$release"
        echo "release=$release" >> "$GITHUB_OUTPUT"

    - name: Install GraalVM
      uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
      with:
        java-version: ${{ steps.java.outputs.release }}
        distribution: graalvm
        github-token: ${{ inputs.github-token }}
        set-java-home: "false"

    # Gradle finds the toolchain (the Java 25 of the build, the native-image) among the paths it is given.
    - name: Give the GraalVM to the Gradle toolchains
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle"
        echo "org.gradle.java.installations.paths=$GRAALVM_HOME" >> "$HOME/.gradle/gradle.properties"

    # The JDK of the project, `.sdkmanrc`, that runs Gradle, bin/ci and the launcher of jdtls. setup-java reads the version
    # and the distribution (Temurin) from that file, so the runner does not depend on the SDKMAN! service (an outage of
    # it, a 504, blocked every check and every release); developers keep SDKMAN!. It sets JAVA_HOME and the PATH.
    - name: Install the JDK of .sdkmanrc
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version-file: .sdkmanrc

    # The step above must have given the release that `.sdkmanrc` pins, not another one.
    - name: Check the JDK of .sdkmanrc
      shell: bash
      run: |
        pinned=$(sed -n 's/^java=//p' .sdkmanrc | grep -oE '^[0-9]+')
        test -x "$JAVA_HOME/bin/java"
        "$JAVA_HOME/bin/java" -version 2>&1 | head -n 1
        "$JAVA_HOME/bin/java" -version 2>&1 | head -n 1 | grep -q "\"$pinned[.\"]"

    - name: Install mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install: false
        cache: false

    - name: Install the tools and jdtls
      shell: bash
      run: |
        mise trust
        mise install
        mise run jdtls:install
