[versions]
junit = "6.1.3"
assertj = "3.27.7"
jacoco = "0.8.15"
archunit = "1.5.1"
# Checkstyle runs in the Gradle build, in its own configuration, not on a module path: a plain catalog entry, with no line
# in gradle/modules.properties.
checkstyle = "14.3.0"
graalvm-native = "1.1.18"
# Named after the Java module, which is how java-module-dependencies finds the version of a `requires` (see
# gradle/modules.properties for the Maven coordinates); org-eclipse-lsp4j also versions org.eclipse.lsp4j.jsonrpc.
org-eclipse-lsp4j = "1.0.0"
com-google-gson = "2.14.0"
org-jspecify = "1.0.1"
com-uber-nullaway-annotations = "0.14.3"
# Error Prone and NullAway run in the compiler, not on a module path: they are plain catalog entries.
errorprone = "2.51.0"
nullaway = "0.14.3"

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
