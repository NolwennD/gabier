[versions]
junit = "6.1.3"
jacoco = "0.8.15"
archunit = "1.4.2"
graalvm-native = "1.1.18"
# Named after the Java module, which is how java-module-dependencies finds the version of a `requires` (see
# gradle/modules.properties for the Maven coordinates); org-eclipse-lsp4j also versions org.eclipse.lsp4j.jsonrpc.
org-eclipse-lsp4j = "1.0.0"
com-google-gson = "2.14.0"

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
